[project]
name = "datasyn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # JAX ecosystem
    "jax >= 0.6, < 0.7",
    "jax-cuda12-pjrt >= 0.6, < 0.7",
    "jax-cuda12-plugin >= 0.6, < 0.7",
    "nvidia-cublas-cu12>=12.1.0",
    "nvidia-cuda-runtime-cu12>=12.1.0",
    "nvidia-cudnn-cu12>=9.0.0",
    "nvidia-cusparse-cu12>=12.1.0",
    "chex",
    "jaxtyping",
    # Math / science
    "lineax",
    "numpy",
    "scipy",
    "pandas",
    # Image / RAW processing
    "Pillow",
    "matplotlib",
    "opencv-python-headless",
    "rawpy",
    "colour-demosaicing",
    "exifread",
    # Storage
    "lmdb",
    "numcodecs",
    "zarr>=3",
    # Config / utils
    "PyYAML",
    "tqdm",
    "termcolor",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/datasyn",
    "src/zernipax",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/zernipax"]  # vendored external — don't lint/reformat

[tool.ruff.lint]
select = ["I", "F"]
ignore = [
    "F403", "F405",  # `from datasyn.jaxutils.typing import *` is a project idiom
    "F722", "F821",  # jaxtyping shape-string annotations (e.g., Float[Array, "h w"])
]

[tool.ruff.lint.per-file-ignores]
# Re-export hubs: modules pulled in via `from X import *` elsewhere. Their
# imports are re-exports (unused locally), so F401 must not strip them.
"**/__init__.py" = ["F401"]
"**/jaxutils/typing.py" = ["F401"]
"**/jaxutils/utils.py" = ["F401"]
"**/optics/typing.py" = ["F401"]
"**/synthesis/layered/scene.py" = ["F401"]
